info:
  name: refresh token
  type: http
  seq: 3

http:
  method: POST
  url: "{{url}}/auth/refresh"
  body:
    type: json
    data: '{"refreshToken": "{{admin-refresh-token}}"}'
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
